<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    /* TODO: write all CSS here */
    /* Hint: start with body, then .card, then .avatar, .name, .role, hr, .skills, .badge */
body {
font-family: Sans-serif;
background-color: #f0fdf4;
padding: 40px 16px;
}
.card {
background-color: white;
padding: 40px;
width: 400px;
border: 1px solid #bbf7d0;
border-radius: 12px;
text-align: center;
margin: 0 auto;
}
.avatar {
width: 80px;
height: 80px;
background-color: #10b981;
border-radius: 50%;
color: white;
justify-content: center;
align-items: center;
font-size:2rem;
font-weight: 700;
margin: 0 auto 16px;
display: flex;
}

.name {
font-size: 1.5rem;
font-weight; 700;
color: #15803d;
}

.role {
color: #64748b;
font-size: 0.9rem;
margin-bottom: 20px;
}

hr {
border: none;
border-top: 1px solid #e2e8f0;
margin-bottom: 20px;
}
.skills {
display: flex;
gap: 8px;
justify-content: center;
flex-wrap: wrap;
}
.badge {
background-color: #dcfce7;
color: #15803d;
padding: 4px 14px;
border-radius: 20px;
font-size: 0.8rem;
font-weight: 600;
}
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">K</div>
    <h2 class="name">Kim Jisoo</h2>
    <p class="role">Web Programming Student</p>
    <hr>
    <div class="skills">
      <span class="badge">HTML5</span>
      <span class="badge">CSS3</span>
      <span class="badge">Flexbox</span>
    </div>
  </div>
</body>
