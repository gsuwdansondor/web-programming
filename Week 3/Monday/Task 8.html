<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My CSS Portfolio</title>
  <style>
    /* 1. Reset */
*, *::before, *::after { 
box-sizing: border-box; 
margin: 0; 
padding: 0; }

    /* 2. Base styles (body, a, h1-h3, p) */
body { 
font-family: 'Segoe UI';
sans-serif; 
font-size: 1rem; 
line-height: 1.6; 
color: #1e293b
background-color: #f0fdf4;
}
a { text-decoration: none; }
h1, h2, h3 { font-weight: 700; }
p { color:64748b; }

    /* 3. Navigation (.nav, .nav-logo, .nav-links, .nav-links a) */
.nav {
display: flex;
justify-content: space-between;
align-items: center;
padding: 10px 20px;
background-color: #ff5768;
color: white;
}

.nav-logo {
font-size: 1.5rem;
font-weight: 700;
color: white;
}

.nav-links {
display: flex;
gap: 8px;
}

.nav-links a {
color: #cbd5e1;
font-size: 1rem
transition: color 0.2s;
}

.nav-links a: hover {
color: #ff5768;
}


    /* 4. Hero section (.hero, .hero h1, .hero p, .btn) */
.hero {
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
text-align: center;
padding: 80px 20px;
background-color: #ffdacc;
}
.hero h1 {
font-size: 2.5rem;
color: #15803d;
margin-bottom: 12px;
}
.hero h1 { color: #00a5e3; margin bottom: 16px; }
.hero p { font-size: 1.15rem; margin-bottom: 32px; color: #475569; }
.btn {
display; inline-block;
background-color: ff6oa8;
color: white;
padding: 14px 32px;
border-radius: 8px;
font-weight: 700;
transition: background-color 0.2s;
}

.btn:hover {
background-color: #15803d;
}

    /* 5. Skills grid (.skills-section, .skills-grid, .skill-card) */
.skills-section {
padding: 60px 32px;
text-align: center;
background-color: #ffffff;
}

.skills-section h2 {
font-size: 2rem;
color: #15803d;
margin-bottom: 32px;
}

.skills-grid {
display: flex;
justify-content: center;
gap: 20px;
flex-wrap: wrap;
max-width: 1000px;
margin: 0 auto;
}

.skill-card {
flex: 1 1 200px;
mad-width: 300px;
background-color: #f0fdf4;
border: 1px solid #bbf7d0;
border-radius: 12px;
padding: 28px 20px;
text-align: center;
transition: transform 0.2s;
}

    /* 6. Footer (.footer) */
.footer p {
background-color: #064e3b;
color: white;
text-align: center;
padding: 24px 16px;
}

.footer p {
color: 3d1fae5;
font-size: 0.9rem;
}



  </style>
</head>
<body>
  <nav class="nav">
    <span class="nav-logo">MyPortfolio</span>
    <div class="nav-links">
      <a href="#skills">Skills</a>
      <a href="#contact">Contact</a>
    </div>
  </nav>

  <section class="hero">
    <h1>Hello, I am Learning CSS!</h1>
    <p>Week 3 · CSS Introduction · Gachon University</p>
    <a href="#skills" class="btn">See My Skills</a>
  </section>

  <section class="skills-section" id="skills">
    <h2>What I Know</h2>
    <div class="skills-grid">
      <div class="skill-card"><h3>HTML5</h3><p>Structure and semantics</p></div>
      <div class="skill-card"><h3>CSS3</h3><p>Styling and layout</p></div>
      <div class="skill-card"><h3>Flexbox</h3><p>Modern layout model</p></div>
    </div>
  </section>

  <footer class="footer">
    <p>K0126002 Web Programming &copy; 2026 Gachon University</p>
  </footer>
</body>
</html>
