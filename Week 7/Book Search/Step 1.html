
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Search</title>
</head>
<body>

    <header>
        <h1>📚 Book Search</h1>
    </header>

    <main>
        <section id="search-section">
            <form id="search-form">
                <input
                    type="text"
                    id="search-input"
                    placeholder="Search books…"
                    required
                >
                <button type="submit">Search</button>
            </form>
        </section>

        <section id="results-section">
            <h2>Results</h2>
            <div id="results-grid">
            </div>
        </section>
    </main>

</body>
</html>
